---
layout: base
---
<header class="container">
  <div class="wordmark">
    <span class="title">
      <a href="/">{{ site.title }}</a>
      {% if layout.section_label %}
        <a href="{{ layout.section_uri }}" class="breadcrumb">{{ layout.section_label }}</a>
      {% endif %}
    </span>
  </div>
</header>

<main class="container">
  {{ content }}
</main>

<footer class="container">
  <p class="center">
    <a href="/" class="face">
      <img src="/assets/images/me.jpg">
    </a>
  </p>
</footer>
