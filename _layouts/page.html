---
layout: default
---
<article>
  <header>
    <h1>{{ page.title }}</h1>
    {% if page.lede %}<p class="page-lede">{{ page.lede }}</p>{% endif %}
  </header>

  {{ content }}

  {% if page.updated %}
    <p class="meta">Updated <time datetime="{{ page.updated | date_to_xmlschema }}">{{ page.updated | date_to_long_string }}</time></p>
  {% endif %}
</article>
