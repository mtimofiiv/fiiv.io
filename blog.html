---
layout: default
permalink: /blog/
---

<h1>Blog</h1>

<ul class="blogroll">
  {% for post in site.posts %}
    <li>
      <h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
      <time datetime="{{post.date  | date_to_xmlschema}}">{{post.date | date_to_long_string: "ordinal"}}</time>

      <p>{{ post.description }}</p>
    </li>
  {% endfor %}
</ul>
