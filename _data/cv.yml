about:
  - >-
    I'm a developer/engineer working mostly on web and mobile projects. I'm
    currently based in Bangkok, Thailand, but most of my work is remote.
  - >-
    Currently, I am working with several freelance clients to build and
    maintain their applications. Additionally, I love building my own apps for
